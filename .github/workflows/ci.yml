name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    name: Build, test, coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Unit test + kiểm định heuristic vét cạn 3x3 + regression tối ưu + JaCoCo.
      - name: mvn verify
        run: mvn -B -ntp verify

      # Benchmark nhỏ, tất định - phát hiện lỗi tính đúng đắn (không dùng để so sánh thời gian).
      # 3x3: đối chiếu với h* chính xác; 4x4: kiểm tra đồng thuận giữa các thuật toán tối ưu.
      - name: Small deterministic benchmark (3x3, exact oracle)
        run: >
          mvn -B -ntp -q exec:java
          -Dexec.args="benchmark --dataset exact-3x3 --algos astar,ida,rbfs,sma:100000,hda:2,focal:1.5
          --heuristics manhattan,linear-conflict,apdb --reps 1 --warmup 0 --timeout 20
          --out target/ci-experiments --name ci-smoke-3x3"

      - name: Optimality consensus benchmark (4x4)
        run: >
          mvn -B -ntp -q exec:java
          -Dexec.args="benchmark --dataset random-15p --algos astar,ida,rbfs,hda:2
          --heuristics apdb --reps 1 --warmup 0 --timeout 20
          --out target/ci-experiments --name ci-consensus-4x4"

      - name: Upload test & coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
            target/ci-experiments/
          retention-days: 14
